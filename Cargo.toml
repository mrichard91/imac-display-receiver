[package]
name = "imac-display-rx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "iMac Display Protocol (IDP v1) receiver: shows a Mac's virtual display on an Ubuntu iMac panel"
publish = false

[lib]
name = "imac_display_rx"
path = "src/lib.rs"

[[bin]]
name = "imac-display-rx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
gst = { package = "gstreamer", version = "0.25" }
gst_app = { package = "gstreamer-app", version = "0.25" }
libc = "0.2"
log = "0.4"
sha2 = "0.11"
socket2 = "0.6"
thiserror = "2"
